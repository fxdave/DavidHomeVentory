<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>HomeVentory</title>
  <defs>
    <linearGradient id="kraftFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dca468"/>
      <stop offset="1" stop-color="#c88b51"/>
    </linearGradient>
    <linearGradient id="slateFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a90c2"/>
      <stop offset="1" stop-color="#5179ad"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f0"/>
      <stop offset="1" stop-color="#e2e0d8"/>
    </linearGradient>

    <!-- A label sticker: a QR finder mark and two lines of text, top right corner peeling off. -->
    <symbol id="sticker" viewBox="0 0 26 12" overflow="visible">
      <path d="M0.8 0.6 H22.6 L25.4 3.4 V11.4 H0.8 Z" fill="#000" opacity="0.28" transform="translate(0.5 0.7)"/>
      <path d="M0.6 0 H22.6 L25.4 2.8 V11 a1 1 0 0 1 -1 1 H0.6 a0.6 0.6 0 0 1 -0.6 -0.6 V0.6 a0.6 0.6 0 0 1 0.6 -0.6 Z" fill="url(#paper)"/>
      <path d="M22.6 0 V2.2 a0.6 0.6 0 0 0 0.6 0.6 H25.4 Z" fill="#c4c1b8"/>
      <rect x="2" y="2" width="8" height="8" rx="1.4" fill="#15171c"/>
      <rect x="3.6" y="3.6" width="4.8" height="4.8" rx="0.7" fill="#efeee9"/>
      <rect x="4.9" y="4.9" width="2.2" height="2.2" rx="0.3" fill="#15171c"/>
      <rect x="12" y="3.6" width="10" height="1.8" rx="0.9" fill="#15171c"/>
      <rect x="12" y="7" width="7" height="1.8" rx="0.9" fill="#6b6e76"/>
    </symbol>
  </defs>

  <!-- Contact shadow under the stack. -->
  <path d="M5 61.2 H47 L57 53.5 H15 Z" fill="#000" opacity="0.22"/>

  <!-- Bottom box: kraft cardboard. -->
  <g stroke="#5b3818" stroke-width="1" stroke-linejoin="round">
    <path d="M47 41 L57 33.5 V53 L47 60.5 Z" fill="#a8703d"/>
    <rect x="4" y="41" width="43" height="19.5" fill="url(#kraftFront)"/>
    <!-- Lid -->
    <path d="M3.4 41 H47.6 L57.6 33.5 H13.4 Z" fill="#ecbb83"/>
    <path d="M47.6 41 L57.6 33.5 V38.5 L47.6 46 Z" fill="#9a6535"/>
    <rect x="3.4" y="41" width="44.2" height="5" fill="#c3864c"/>
  </g>
  <use href="#sticker" x="7.5" y="47.5" width="26" height="12" transform="rotate(1.5 20 53)"/>

  <!-- Top box: slate blue shoebox, set back on the lid of the bottom one. -->
  <g stroke="#1f3352" stroke-width="1" stroke-linejoin="round">
    <path d="M50 38 L59 31.2 V12.2 L50 19 Z" fill="#3f6497"/>
    <rect x="10" y="19" width="40" height="19" fill="url(#slateFront)"/>
    <!-- Lid -->
    <path d="M9.4 19 H50.6 L59.6 12.2 H18.4 Z" fill="#8db0dc"/>
    <path d="M50.6 19 L59.6 12.2 V17 L50.6 23.8 Z" fill="#33568a"/>
    <rect x="9.4" y="19" width="41.2" height="4.8" fill="#4b72a6"/>
  </g>
  <use href="#sticker" x="13.5" y="25" width="26" height="12" transform="rotate(-2 26.5 31)"/>
</svg>
