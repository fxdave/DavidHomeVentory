# Production stack: `make install`, `make prod-start` (see README).
# Ports live in compose.prod.override.yml (gitignored, created from
# compose.prod.override.yml.sample by `make install`).
services:
  app:
    image: node:alpine
    restart: unless-stopped
    volumes:
      - ./:/app
    working_dir: /app/back
    command: ["npm", "start"]